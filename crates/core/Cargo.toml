[package]
name = "appsec-core"
version = "0.2.1"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled", "uuid", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.13", features = ["blocking"] }
rustls = "0.23"
rustls-native-certs = "0.8"
webpki-roots = "1"
x509-parser = "0.18"
