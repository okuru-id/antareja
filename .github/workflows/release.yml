name: Release

# Build desktop app (Linux, macOS, Windows) saat tag versi di-push, mis. `git tag v0.2.0 && git push origin v0.2.0`.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # untuk membuat GitHub Release + unggah bundle

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   bundles: 'deb appimage rpm' }  # Linux x86_64
          - { os: macos-13,       bundles: 'dmg' }               # macOS Intel (x86_64)
          - { os: macos-14,       bundles: 'dmg' }               # macOS Apple Silicon (arm64)
          - { os: windows-latest, bundles: 'nsis msi' }          # Windows x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependensi sistem (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: ${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependensi frontend
        run: npm --prefix ui ci

      - name: Unduh sidecar (gitleaks, trivy, nuclei)
        shell: bash
        run: bash scripts/fetch-sidecars.sh

      - name: Install Tauri CLI
        run: npm i -g @tauri-apps/cli@^2

      - name: Build (${{ matrix.bundles }})
        run: tauri build --bundles ${{ matrix.bundles }}

      - name: Buat Release + unggah bundle
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
